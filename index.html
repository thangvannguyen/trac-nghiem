<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tạo thư mục câu hỏi trắc nghiệm, tự học, ôn tập và chia sẻ cùng bạn bè." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap&subset=vietnamese" rel="stylesheet" />
    <script>
      // Chống bị nhúng vào trang lạ (clickjacking) – cần cho GitHub Pages vì không đặt được header bảo mật.
      if (window.top !== window.self) {
        try { window.top.location = window.self.location.href; } catch (e) { document.documentElement.style.display = 'none'; }
      }
      // Tô đúng chế độ Sáng / Tối ngay khi mở trang (trước khi tải cài đặt từ database).
      try {
        var t = localStorage.getItem('theme-cache');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        var k = localStorage.getItem('skin-cache');
        if (k) document.documentElement.dataset.skin = k;
      } catch (e) {}
    </script>
    <title>Cú Học Bài – Trắc nghiệm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
