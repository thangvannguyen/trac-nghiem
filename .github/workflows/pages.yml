# Tự build & đưa web lên GitHub Pages (https://thangvannguyen.github.io/trac-nghiem/) mỗi lần push lên main.
# Bản trên Firebase Hosting (https://trac-nghiem-4804e.web.app) vẫn deploy riêng bằng Firebase CLI.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build (đường dẫn gốc /trac-nghiem/)
        run: npm run build
        env:
          BASE_PATH: /trac-nghiem/
      # GitHub Pages không có rewrite cho web 1 trang: dùng 404.html để mở thẳng các đường dẫn như /f/…
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
